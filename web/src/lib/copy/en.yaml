  saved: Saved the models for {task}.

  # The table.
  task: Task
  provider: Provider
  order: Order
  plugin: plugin
  backup: backup
  oneOut: one out
  inTurn: In turn
  atRandom: At random
  note: >-
    Fetching a provider’s models asks it over the Internet, with your key.
    Providers and their keys are on the {providers} page; the rest of {path}
    is under {openRouter} in Other settings.

  # The pane.
  addedBy: A task added by {plugin}, as {id}.
  aPlugin: a plugin
  noOwnModel: "No model of its own: Dialogue’s rotation answers."
  orderAsDialogue: "{order}, as Dialogue"
  maxTokens: Max tokens
