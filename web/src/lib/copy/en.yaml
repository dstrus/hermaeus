    slotWeight: "{slot}’s weight"
    slotRequestTimeout: "{slot}’s request timeout"
    slotConnectTimeout: "{slot}’s connect timeout"
    slotRetries: "{slot}’s retries"
    notNumber: "{label} must be a number."
    notWhole: "{label} must be a whole number."

  # Trying a task’s model with one prompt.
  test:
    title: Try it
    onFateless: >-
      Its models are on Fateless, which SkyrimNet reaches through its own
      sign-in. Hermaeus doesn’t have that sign-in, so SkyrimNet’s dashboard is
      where to test them.
    noChat: None of its models is on a chat provider, so there’s nothing a test can send to.
    noModel: It has no model of its own to try.
    model: Model
    slotOff: (off)
    instructions: Instructions
    prompt: Prompt
    vision: >-
      A test sends text only, so the model gets a description rather than a
      picture. It shows how the model writes, not how it sees.
    sends: >-
      Sends one request to {provider}, as SkyrimNet would, with the task’s
      sampling settings and up to {tokens} tokens of reply. A paid provider
      bills it like any other request.
    waiting: Waiting for a reply…
    send: Send
    emptyReply: (An empty reply.)
    cutOff: Cut off at {tokens} tokens.
    answeredBy: Answered by
    through: through {upstream}
    took: Took
    seconds: "{seconds} s"
    tokens: Tokens
    tokensInOut: "{input} in, {output} out"
    cost: Cost
    free: free
    asBilled: as billed
    byListedPrices: by its listed prices
    notReported: Not reported. Fetch this provider’s models to price it by their list.
    reasoning: Its reasoning

  # The prompt each task’s test starts from, shaped like its job, by task
  # id: stand-ins for SkyrimNet’s real prompts, which are long templates
  # filled in from the game. A plugin’s task just checks for a reply.
  samples:
    default:
      system: You are an innkeeper in Skyrim. Stay in character.
      prompt: A traveler walks in out of the snow. Greet them in a sentence or two.
    combat:
      system: You are a bandit in the middle of a fight. Stay in character.
      prompt: "The traveler just cut your arm with a war axe. Say one line, then choose: flee, surrender, or fight on."
    characterProfileGeneration:
      system: "Write a character bio with three short sections: Summary, Personality, and Speech."
      prompt: Write a bio for the innkeeper of an inn in Whiterun, in under 150 words.
    diaryGeneration:
      system: Write a first-person diary entry for the character described.
      prompt: You are a housecarl. Today you fought a dragon at a watchtower beside your thane. Write tonight’s entry in about 120 words.
    memory:
      system: Turn the events into one first-person memory, then rate how much it matters, from 0 to 1.
      prompt: The traveler paid for a room. They asked about the Companions. They left a large tip.
    gamemasterEvaluation:
      system: You direct a scene. Say who should speak next and why, or that no one should.
      prompt: In a tavern, a bard has just finished a song. A guard is drinking alone, and two farmers are arguing about the harvest.
    actionEvaluation:
      system: Choose the best action from the list, or none. Reply with its name only.
      prompt: "The innkeeper hears: “I’d like a room for the night.” Actions: RentRoom, OpenTrade, Follow, none."
    meta:
      system: Answer in one word.
      prompt: Who is this line meant for, the innkeeper or the bard? “Play something cheerful.”
    universalTranslator:
      system: Rewrite the line in the speech pattern given, keeping its meaning.
      prompt: "Pattern: an old sea captain. Line: “I don’t know where the key is, but the jarl might.”"
    agentDefault:
      system: You help a player set up SkyrimNet.
      prompt: How do I make characters talk to each other less often?
    vision:
      system: Describe the place in two sentences, as for someone who can’t see it.
      prompt: A snowy courtyard with a broken well and a shuttered forge.
    visionQuality:
      system: Describe the place in two sentences, as for someone who can’t see it.
      prompt: A snowy courtyard with a broken well and a shuttered forge.
    pluginTask: Reply with one short sentence to confirm you’re working.

