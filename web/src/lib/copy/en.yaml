    none: "Nothing replaces any of SkyrimNet’s files: it uses its own throughout."
    nothingToCheck: Nothing to check.
    file: File
    inPlaceOf: In place of
    older: older
    conflict: conflict
    added: "Nothing: added"
    pluginUsed: "{plugin}’s copy is used"
    ownUsed: "{own} is used"
    ownCopy: Your own copy
    usedInPlaceOf: "{used}, in place of {layers}."
    usedAdding: "{used}. Nothing below has this file, so it adds one rather than replacing one."
    openOn: Open on the {page} page
    stale: >-
      Your copy is older than the one it replaces, so it may be missing changes
