    unstructured: no structured outputs

  # A provider’s list of models, fetched on request.
  lists:
    asking: asking…
    fetched: { one: "{count} model fetched", other: "{count} models fetched" }
    notFetched: models not fetched
    fetch: Fetch models
    fetchAgain: Fetch again
    context: "{tokens} context"
    free: free
    prices: "${input} in, ${output} out per million tokens"

  # SkyrimNet’s own tasks, by id. A plugin’s task is named from its id.
  tasks:
    default:
      label: Dialogue
      what: What NPCs say in conversation, and any task without a model of its own.
    combat:
      label: Combat
      what: What NPCs say and do while fighting.
    characterProfileGeneration:
      label: Character profiles
      what: Writing and rewriting NPCs’ bios.
    diaryGeneration:
      label: Diary
      what: NPCs’ diary entries.
    memory:
      label: Memory
      what: Turning events into memories, with how much they matter.
    gamemasterEvaluation:
      label: GameMaster
      what: Reading a scene and deciding who speaks or acts.
    actionEvaluation:
      label: Action evaluation
      what: Which actions an NPC may take in response to an event.
    meta:
      label: Meta
      what: "Quick sorting and routing: a fast, cheap model."
    decisions:
      label: Decisions
      what: >-
        Typed questions (an NPC’s mood, who speaks next) answered with
        probabilities. Needs a provider with the Decisions or System One API
        style; sampling settings don’t apply.
    vision:
      label: Vision
      what: Describing screenshots for OmniSight.
    visionQuality:
      label: Vision (quality)
      what: Describing the OmniSight captures you take yourself, with a stronger model.
    universalTranslator:
      label: Universal Translator
      what: Rewriting NPCs’ lines in their speech patterns.
    agentDefault:
      label: AI assistant
      what: The dashboard’s tool-calling assistant.

  # How a slot thinks first.
  efforts:
    inherited: Inherited
    "off": "Off"
    default: Model’s default
    minimal: Minimal
    low: Low
    medium: Medium
    high: High

  # A task’s models as a form.
  form:
    rotation: Rotation
    rotationHint: SkyrimNet tries the models in turn or at random; a backup only answers when no primary does.
    model: Model
    modelPlaceholder: vendor/model
    notInList: Not in {provider}’s list.
    provider: Provider
    noKey: "{name} (no key)"
    role: Role
    primary: Primary
    backup: Backup
    temp: Temp.
    inRotation: In rotation
    weight: Weight
    requestTimeout: Request timeout
    connectTimeout: Connect timeout
    retries: Retries
    reasoning: Reasoning
    structuredOutputs: Structured outputs
    providerDefault: Provider’s default
    addModel: Add a model
    asking: Asking {provider}…
    fetch: Fetch {provider}’s models
    fetchAgain: Fetch {provider}’s models again
    offered:
      one: "{count} model, offered as you type."
      other: "{count} models, offered as you type."
    signIn: "{provider} is reached through SkyrimNet’s own sign-in, so Hermaeus can’t fetch its list."
    noList: "{provider} has no list to fetch."
    asks: Asks {provider} over the Internet.
    asksWithKey: Asks {provider} over the Internet, with your key.
    order: Order
    rotationOrder: Rotation order
    asDialogue: As Dialogue
    forEveryModel: For every model here
    forEveryModelHint: Unless a slot above says otherwise. Empty leaves it to the provider.
    temperature: Temperature
    maxTokens: Max tokens
    timeoutSeconds: Timeout (s)
    topP: Top-p
    topK: Top-k
    frequencyPenalty: Frequency penalty
    presencePenalty: Presence penalty
