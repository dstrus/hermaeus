      audience:
        label: Who hears it
        choices:
          player: You
          originator: Whoever caused it
          target: Whoever it happened to
          originatorOrTarget: Either of them
          everyone: Everyone
          nearbyNpcs: Characters nearby
          enabledVirtualNpcs: Virtual NPCs that are on
      timing: Timing
      probability:
        label: Chance
        hint: From 0 to 1.
      cooldownSeconds:
        label: Cooldown
        hint: In seconds.
      priority: { label: Priority }
      interrupt: { label: Interrupts whoever is speaking }

    actions:
      noun: action
      name: { label: Name }
      enabled: { label: "On" }
      description:
        label: Description
        hint: What the AI reads to decide when to use it.
      customCategory:
        label: Category
        hint: Actions in a category are offered together.
      defaultPriority: { label: Priority }
      eventString:
        label: Event text
        hint: Recorded when it runs, such as {{ actor.name }} gave {{ player.name }} a hug.
      useConfirmationWindow: { label: Ask before running it }
      isShortLived: { label: Short-lived }
      call:
        title: Papyrus call
        note: "No call: this action is a category. The AI picks it, then chooses one of the category’s actions."
      questEditorId: { label: Quest }
      scriptName: { label: Script }
      executionFunctionName: { label: Function }
      parameters:
        title: Parameters, in the function’s order
        add: parameter
        type:
          label: From
          choices:
            speaker: The speaker
            dynamic: The AI fills it in
            dynamicUuid: The AI picks a character, passed as its UUID
            static: A fixed value
        name: { label: Name }
        value: { label: Value }
        description:
          label: Description
          hint: Tells the AI what to put here.
        optional: { label: The AI may leave it out }
        default: { label: Default }
        useNearbyActors: { label: Choose from characters nearby }
      rules:
        title: "Who can use it: every rule must pass"
        add: rule
        empty: "None: anyone can."
        note: SkyrimNet ignores a rule that isn’t required.
        logicalOperator: { label: Conditions that must pass }
        required: { label: Required }
      conditions:
        title: Conditions
        add: condition
        decoratorName: { label: Decorator }
        arguments:
          label: Arguments
          hint: "Separated by commas: currentActor (the speaker), player…"
        comparisonOperator: { label: Test }
        expectedValue: { label: Expected }

    filters:
      noun: filter
      kind:
        label: Kind
        choices:
          actor: Who takes part (actor)
          memory: Who forms memories (memory)
          dialogueRule: Rewrite what’s said (dialogue_rule)
          ttsRule: Rewrite what’s spoken aloud (tts_rule)
      enabled: { label: "On" }
      id: { label: Id }
      priority:
        label: Priority
        hint: Lower runs first; 100 when empty.
      pattern:
        label: Pattern
        hint: A regular expression.
      replacement:
        label: Replacement
        hint: Empty removes what matches.
        dialogueHint: Empty skips the whole line; otherwise it replaces what matches.
      name: { label: Name }
      description: { label: Description }
      lists: Lists, added to your own filter lists
      factionWhitelist: { label: Faction whitelist }
      factionBlacklist: { label: Faction blacklist }
      raceWhitelist: { label: Race whitelist }
      raceBlacklist: { label: Race blacklist }
      genderWhitelist: { label: Gender whitelist }
      genderBlacklist: { label: Gender blacklist }

    dialogueActions:
      noun: dialogue action
      kind:
        label: Kind
        choices:
          lists: Lines allowed and blocked (lists)
          instruction: When to choose a line (instruction)
      enabled: { label: "On" }
      key: { label: Dialogue line }
      name: { label: Name }
      category: { label: Category }
      text:
        label: Instruction
        hint: Tells the AI when to choose this line.
      description: { label: Description }
      whitelist: { label: Always allowed lines }
      blacklist: { label: Lines never said }

    entities:
      noun: entity
      entityName:
        label: Name
        hint: How SkyrimNet and triggers refer to it.
      enabled: { label: "On" }
      displayName: { label: Display name }
      voiceId:
        label: Voice
        hint: A voice type from your voice setup.
      ttsOverride: { label: Voice engine }
      language: { label: Language }
      conversationMode:
        label: Conversation mode
        choices:
          private: Private
          public: Public
        hint: "Private: only you hear it. Public: characters nearby hear it and react too."

  # Voice effects: recipes of stages that change how a voice sounds.
  voiceEffects:
    title: Voice effects
    count: { one: "{count} effect", other: "{count} effects" }
    newEffect: New effect
    newVoiceEffect: New voice effect
    search: Search effects
    lead: >-
      Recipes that change how a voice sounds, such as a draugr’s or a ghost’s,
      applied to speech one stage at a time. A recipe doesn’t say whom it’s
      for: a trigger puts it on a character, a mod’s script can, and SkyrimNet
      uses two itself, for the narrator and your thoughts. Each names the
      recipe by its id.
    limits: >-
      SkyrimNet limits what each stage’s settings and a voice sample can be, in
      ways that aren’t published, so Hermaeus can’t show those limits or check
      them. An effect outside those limits may not work in the game.
      SkyrimNet’s own dashboard shows the limits as you edit.
    readOnly: Skyrim is running, so effects can only be read.
    none: No voice effects in SkyrimNet’s defaults, your plugins, or your own edits.
    effect: Effect
    stages: Stages
    noChain: None
    voiceEffect: Voice effect
    itsFile: its file
    own: Your own
    noStages: "None: the voice is left as it is."
    sample: Sample
    noSample: "None: the speaker’s own voice is cloned."
    usedBy: Used by
    narrator: The narrator, when {setting} is on.
    narratorSetting: Narrator effect
    thoughts: Your thoughts, when {setting} is on.
    thoughtsSetting: Thoughts effect
    switchedOnBy: Switched on by {trigger}
    switchedOffBy: Switched off by {trigger}
    noTrigger: No trigger switches it on.
    script: >-
      A mod’s script can also put it on a character, with SkyrimNet’s
      SetVoiceEffect and the id {id}. Who has an effect is kept in your saves,
      so it isn’t listed here.

    # Editing one.
    editingOwn: Editing {yourCopy}, which SkyrimNet uses in place of any other.
    startingFrom: Starting from the one from {layer}. Saving makes your own copy, which replaces it.
    id: Id
    idHint: >-
      The id of the effect, which is how triggers and scripts refer to it when
      assigning it to a character. This will also be used in the name of the
      YAML file for the effect. Lowercase letters, digits, and underscores
      only. It can’t change later.
    name: Name
    namePlaceholder: Frost atronach
    sampleLabel: Replacement voice sample
    samplePlaceholder: None
    sampleHint: >-
      The file name of a .wav recording cloned in place of the speaker’s usual
      voice while the effect is on. Upload the recording with SkyrimNet’s
      dashboard. Leave it empty to keep the speaker’s voice.
    order: Applied to the voice in order, top to bottom.
    stage: Stage {n}
    moveStageUp: Move stage {n} up
    moveStageDown: Move stage {n} down
    removeStage: Remove stage {n}
    noDraftStages: "No stages: the voice is left as it is."
    addStage: Add a stage
    addStageMenu: Add a stage…
    needsNumber: "Stage {n} ({stage}): {param} needs a number."

    # What happened.
    nextBelow: the one from {layer} applies again
    nextNone: the effect is gone, since only you had it
    removed: Removed {name}.
    made: Made {name}. SkyrimNet uses it from the next time it starts.
    savedCopy: Saved your copy. SkyrimNet uses it from the next time it starts.
    savedAsCopy: Saved as your own copy, in place of the one below. SkyrimNet uses it from the next time it starts.

    # Each kind of stage, by its type: its name, what it does, and its
    # settings by name, each with its unit, if any.
    stageKinds:
      pitchShift:
        label: Pitch shift
        what: Raises or lowers the voice.
        params:
          semitones: { label: Semitones, unit: { one: semitone, other: semitones } }
      formantShift:
        label: Formant shift
        what: Changes the size the voice sounds, as from a larger or smaller throat, without changing its pitch.
        params:
          semitones: { label: Semitones, unit: { one: semitone, other: semitones } }
      speed:
        label: Speed
        what: Speeds speech up or slows it down. Higher is faster.
        params:
          ratio: { label: Ratio }
      bitcrush:
        label: Bitcrusher
        what: Coarsens the sound, like old or broken audio.
        params:
          bits: { label: Bits }
          rateDiv: { label: Rate divider }
      distortion:
        label: Distortion
        what: Roughens the voice.
        params:
          drive: { label: Drive }
          mix: { label: Mix }
      reverb:
        label: Reverb
        what: Places the voice in a room, a hall, or a cave.
        params:
          roomSize: { label: Room size }
          decay: { label: Decay }
          wet: { label: Wet }
      chorus:
        label: Chorus
        what: Layers slightly shifted copies of the voice, as if several speak at once.
        params:
          rateHz: { label: Rate, unit: Hz }
          depthMs: { label: Depth, unit: ms }
          voices: { label: Voices }
      tremolo:
        label: Tremolo
        what: Makes the voice waver in loudness.
        params:
          rateHz: { label: Rate, unit: Hz }
          depth: { label: Depth }
      ringmod:
        label: Ring modulation
        what: Gives the voice a metallic, inhuman ring.
        params:
          freqHz: { label: Frequency, unit: Hz }
          mix: { label: Mix }
      echo:
        label: Echo
        what: Repeats the voice after a delay.
        params:
          delayMs: { label: Delay, unit: ms }
          feedback: { label: Feedback }
          wet: { label: Wet }
      eq:
        label: Equalizer
        what: Raises or cuts part of the sound, around a frequency.
        params:
          mode: { label: Mode }
          freqHz: { label: Frequency, unit: Hz }
          q: { label: Width }
          gainDb: { label: Gain, unit: dB }
      whisper:
        label: Whisper
        what: Mixes in breath noise, for a hushed or ghostly voice.
        params:
          noiseDb: { label: Noise, unit: dB }
          mix: { label: Mix }
      gain:
        label: Gain
        what: Makes the voice louder or quieter.
        params:
          gainDb: { label: Gain, unit: dB }

  # Every file a plugin or the player’s edits put in place of another, and
  # what it changed.
  overrides:
    title: Overrides
    count: { one: "{count} file", other: "{count} files" }
    showFlagged: Show the {count} to check
    search: Search files
