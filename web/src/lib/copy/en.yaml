# Every word Hermaeus shows, grouped by page. Components use these as
# m.<group>.<name>, so renaming or removing one means changing them too;
# a mistake fails `make test`.
#
# - {name} is filled in when the message is shown.
# - A message with `one:` and `other:` picks one by its count; {count} is
#   the number, written as the reader's locale writes numbers.
# - Typographic quotes and apostrophes: ’ “ ”.

# Words many pages share.
common:
  next: Next
  previous: Previous
  selected: Selected
  switchOn: Switch on
  switchOff: Switch off
  moveUp: Move up
  moveDown: Move down
  up: Up
  down: Down
  off: "off"
  gameRunning: Skyrim is running, so nothing can be changed until you close it.
  edit: Edit
  save: Save
  cancel: Cancel
  remove: Remove
  resetToDefault: Reset to default
  open: Open
  delete: Delete
  showAll: Show all
  keep: Keep
  isOn: "On"
  isOff: "Off"
  moreSettings: More settings
  fewerSettings: Fewer settings
  notSetUp: Not set up yet
  notWrittenYet: SkyrimNet hasn’t written {path} yet; it will the next time it starts. Until then there’s nothing to change here.

plugins:
  title: Plugins
  installed:
    one: "{count} plugin installed"
    other: "{count} plugins installed"
  offCount: "{count} off"
  pendingCount: "{count} not added yet"
  lead: >-
    What SkyrimNet loads, in order. Lower in the list wins. A plugin’s prompt
    replaces the same prompt in any plugin above it. Your own edits, at the
    bottom, win over everything else.
  hub: Installing, updating, and removing plugins happens in SkyrimNet’s dashboard, through its Plugin Hub.

  # The table.
  order: Order
  plugin: Plugin
  version: Version
  holds: Holds
  notAddedYet: not added yet
  someReplaced: some replaced
  nothing: Nothing
  modOff: Its mod is switched off
  notFound: Not found

  # Where a plugin comes from.
  fromSkyrimNet: SkyrimNet
  yours: Yours
  fromHub: From the Hub
  fromMod: From a mod
  local: Local
  by: "by {author}"
  # The page that edits a file a plugin replaced, by what the file is.
  editOn:
    bio: Bio
    prompt: Prompt
    content: Content

  # What a plugin holds, by top folder. A folder not listed here is shown
  # as {count} and its own name.
  contents:
    prompts: { one: "{count} prompt", other: "{count} prompts" }
    bios: { one: "{count} bio", other: "{count} bios" }
    actions: { one: "{count} action", other: "{count} actions" }
    triggers: { one: "{count} trigger", other: "{count} triggers" }
    filters: { one: "{count} filter", other: "{count} filters" }
    voiceEffects: { one: "{count} voice effect", other: "{count} voice effects" }
    entities: { one: "{count} entity", other: "{count} entities" }
    dialogueActions: { one: "{count} dialogue action", other: "{count} dialogue actions" }
    translator: { one: "{count} speech rule", other: "{count} speech rules" }
    items: { one: "{count} item", other: "{count} items" }
    spells: { one: "{count} spell", other: "{count} spells" }
    furniture: { one: "{count} furniture name", other: "{count} furniture names" }
    identity: { one: "{count} identity link", other: "{count} identity links" }
    places: { one: "{count} named place", other: "{count} named places" }
    knowledge: { one: "{count} knowledge pack", other: "{count} knowledge packs" }
    settings: { one: "{count} settings file", other: "{count} settings files" }
    config: { one: "{count} config file", other: "{count} config files" }
  otherFolder: "{count} {folder}"

  # What happened.
  wins: "{winner} now wins over {loser}."
  switchedOff: "Switched off {title}. SkyrimNet ignores it from the next time it starts."
  switchedOn: "Switched on {title}. SkyrimNet loads it from the next time it starts."

  # The pane.
  pending: >-
    Found on disk, but SkyrimNet hasn’t added it to its plugins yet. It will the
    next time it starts, at the bottom of this list, over every other plugin,
    and it can be moved and switched here then.
  isOff: "Switched off: SkyrimNet doesn’t load it, so nothing in it applies."
  files: Files
  modOffFiles: >-
    Its mod, {mod}, is switched off in Mod Organizer’s profile, so SkyrimNet
    can’t see it either. Its order and switch here still apply when the mod is
    on again.
  notAnywhere: Not in the SkyrimNet folder or any mod Hermaeus can see. Its order and switch still work here.
  folder: Folder
  tags: Tags
  settings: Settings
  ownSettings: "{count} of its own"
  models: Models
  ownTasks:
    one: its own model task
    other: its own model tasks
  replaces:
    one: Replaces {count} prompt above it
    other: Replaces {count} prompts above it
  replaced:
    one: "{count} prompt replaced below it"
    other: "{count} prompts replaced below it"
  replacedWhy: A plugin lower in the list, or your own edits, has these too, so theirs apply.

# The feature pages: settings files shown in each feature’s own terms. Each
# feature has its title and lead, then its sections, each holding its title
# and its fields by key.
features:
  # What every feature page shares.
  page:
    notWritten: Not written yet
    changed: "{count} changed from the defaults"
    unchanged: Nothing differs from the defaults
    notWrittenNotice: >-
      SkyrimNet hasn’t written {path} yet; it will the next time it starts.
      Until then the defaults can be read but not changed.
    noPage: There’s no page “{feature}” under {group}.
    setting: Setting
    value: Value
    default: Default
    everythingElse: Everything else in {path} is on its {link}.
    fullSettingsPage: full settings page
    keyIn: "{key} in {path}"
    now: Now
    notInFile: not in the file, so the default
    defaultIs: default {value}

    # The editor. Its label, by kind of value, when the field has no unit.
    percent: Percent
    minutes: Minutes
    chosen: Chosen
    key: Key
    range: "{min} to {max}"
    percentRange: 0 to 100
    pressKey: Press the key to use
    pressHint: Press a key, or click the box with a mouse button.
    noKey: No key
    replaceSecret: Type a new one to replace it
    secretSaved: Saved into {path}. Hermaeus never shows it again; save it empty to clear it.
    onePerLine: One per line
    onePerLineHint: One per line. Blank lines are left out.
    name: Name
    addEntry: Add an entry
    entry: entry {n}
    numbered: "{label} {n}"
    removeEntry: Remove entry {n}
    removeNamed: Remove {name}
    valueFor: "{column} for {name}"
    spacesCount: Spaces count, so a phrase like “ - ” matches only with its spaces.
    columnUnit: "{label} ({unit})"
    columnPercent: "{label} %"
    cell: "{column} {value}"

    # What happened.
    switchedOn: "{label}: on."
    switchedOff: "{label}: off."
    saved: "{label}: {value}."
    mapChangedOne: "{label}: {name} changed."
    mapChanged: "{label}: {count} changed."
    reset: "{label} is back to its default."

  # A setting’s value as the page shows it, and what’s wrong with one typed in.
  values:
    "on": "On"
    "off": "Off"
    cellOn: "on"
    set: Set
    notSet: Not set
    none: None
    picked: "{count} of {total}"
    entries: { one: "{count} entry", other: "{count} entries" }
    rowsOn: "{entries}, {count} on"
    minutes: "{value} min"
    withUnit: "{value} {unit}"
    firstPart: first part
    eachNeeds: Each entry needs its {part}.
    entryNeeds: "{entry} needs its {column}."
    cellNeedsNumber: "{entry}: {column} needs a number."
    cellPercent: "{entry}: {column} is a percentage, from 0 to 100."
    cellWhole: "{entry}: {column} is a whole number."
    cellRange: "{entry}: {column} is from {min} to {max}."
    choose: Choose a value for {label}.
    percent: "{label} is a percentage, from 0 to 100."
    whole: "{label} is a whole number."
    needsNumber: "{label} needs a number."
    notNumber: "{label} must be a number."
    atLeast: "{label} is at least {min}."
    atMost: "{label} is at most {max}."

  # The filter lists below the actor and memory filters.
  filters:
    inEffect: In effect
    inEffectWhat: What every list below adds up to, with the lists each entry comes from.
    nothing: Nothing
    lists: Lists
    newList: New list
    listsWhat: >-
      Every list adds its entries. Editing a built-in or plugin list saves your
      own copy over it; remove the copy to bring the original back. To drop one
      of them entirely, edit it and empty it.
    total:
      one: "{count} list, from SkyrimNet’s defaults, your plugins, and your own."
      other: "{count} lists, from SkyrimNet’s defaults, your plugins, and your own."
    none:
      memory: No memory filter lists in any layer.
      actor: No actor filter lists in any layer.
    yours: Yours
    builtIn: Built-in
    copyIn: Your copy of the one in {plugin}
    count: "{label}: {count}"
    empty: Empty
    edit: Edit {name}
    yourCopy: Your copy of {name}
    editCopy: Edit a copy
    removeCopy: Remove copy
    name: Name
    description: Description
    perLine: One {noun} per line, by editor ID
    add: Add
    added: Added {name}.
    saved: Saved {name}.
    savedCopy: Saved your copy of {name}. It replaces the original until you remove it.
    removedCopy: Removed your copy of {name}; the one in {plugin} applies again.
    removed: Removed {name}.
    # The six lists a filter list adds to.
    fields:
      factionWhitelist:
        label: Faction whitelist
        noun: faction
      factionBlacklist:
        label: Faction blacklist
        noun: faction
      raceWhitelist:
        label: Race whitelist
        noun: race
      raceBlacklist:
        label: Race blacklist
        noun: race
      genderWhitelist:
        label: Gender whitelist
        noun: gender
        placeholder: Male or Female, one per line
      genderBlacklist:
        label: Gender blacklist
        noun: gender
        placeholder: Male or Female, one per line

  # A plugin’s settings page, from the schema it ships.
  pluginSettings:
    general: General
    what: These are the plugin’s own settings, as it describes them.
    notFound: No plugin describes settings called “{name}”.

  # A voice engine’s title bar and tabs.
  engine:
    inUse: In use
    notInUse: Not in use
    choose: Choose the engine
    menu: Engine
    optionInUse: "{engine} · in use"
    settings: Settings
    clones: Cloned voices
    notFound: There’s no voice engine “{engine}”.
    noClones: "{engine} keeps no cloned voices."

  # The voices a cloud engine has cloned into the player’s account.
  clones:
    none: >-
      None yet. SkyrimNet’s dashboard can clone voice types into your {account}
      account all at once with its bulk clone.
    count:
      one: "{count} voice in your {account} account."
      other: "{count} voices in your {account} account."
    countKept:
      one: >-
        {count} voice in your {account} account, of up to {max} kept. Before
        cloning past the limit, SkyrimNet deletes the voice used longest ago.
      other: >-
        {count} voices in your {account} account, of up to {max} kept. Before
        cloning past the limit, SkyrimNet deletes the voice used longest ago.
    over: >-
      More than the limit. Each time SkyrimNet clones another voice, it first
      deletes the one used longest ago, but never one cloned outside SkyrimNet.
    voiceType: Voice type
    language: Language
    lastUsed: Last used
    unnamed:
      one: "{count} other voice with a name Hermaeus can’t read."
      other: "{count} other voices with a name Hermaeus can’t read."

  gamemaster:
    title: GameMaster
    what: The GameMaster reads the scene around you and decides when characters speak up or act.
    general:
      title: General
      gamemasterEnabled:
        label: GameMaster
        what: The GameMaster altogether, which also handles replies to what you say.
      gamemasterAgentEnabled:
        label: Act on its own
        what: >-
          Let the GameMaster start scenes by itself, prompting characters to
          speak now and then.
      gamemasterExcludeActorsInScenes:
        label: Leave scenes alone
        what: >-
          Don’t choose characters who are busy in one of the game’s own scenes,
          such as scripted events or vanilla dialogue.
    timing:
      title: Timing
      gamemasterActionCooldownSeconds:
        label: Between actions
        what: How long the GameMaster waits after one action before the next.
        unit: seconds
      gamemasterRequestTimeoutSeconds:
        label: Give the model
        what: How long a request to the GameMaster’s model can take before it’s given up.
        unit: seconds
      gamemasterContinuousSceneCooldownSeconds:
        label: Restart a stalled scene after
        what: >-
          In a continuous scene, the next character speaks as the last one
          finishes. If the conversation dies instead, the GameMaster tries to
          restart it after this much silence.
        unit: seconds
    context:
      title: Context
      gamemasterNearbyActorRadius:
        label: Who counts as nearby
        what: How far away, in game units, a character can be and still be part of the scene.
        unit: units
      gamemasterRecentEventsCount:
        label: Recent events considered
        what: How many of the latest events the GameMaster reads before deciding.
        unit: events

  narration:
    title: Narration
    what: A narrator describing what happens around you, spoken or as subtitles.
    narration:
      title: Narration
      narrationEnabled:
        label: Narrate
        what: Have a narrator describe what happens.
      narrationSubtitlesOnly:
        label: Subtitles only
        what: >-
          Show the narration as subtitles without voicing it. It still goes into
          prompts and the event history.
      narrationDisableDuringCombat:
        label: Quiet in combat
        what: No narration while you’re fighting.
      narrationDisableFactions:
        label: Quiet in these factions
        what: >-
          No narration while you belong to any of these factions, by editor ID,
          separated by commas.

  conversation:
    title: Conversation
    what: >-
      How characters take turns to speak: how many times they can reply to one
      another, which reasons to speak are prioritized, and how long each kind
      may wait its turn before it’s dropped.
    turnTaking:
      title: Turn taking
      maxChainDepth:
        label: Replies in a row
        what: >-
          How many characters may answer one another after an opening line
          before the exchange ends.
        unit: replies
      takeoverBeforeAudio:
        label: Urgent lines go first
        what: >-
          A more urgent reason to speak, such as you or a line said to someone,
          replaces a line still being made, before any of it is heard.
      leadSeconds:
        label: Head start
        what: >-
          How long before the current line ends the next one starts being made.
          At 0, SkyrimNet judges it from recent lines.
        zero: Auto
      generationTimeoutSeconds:
        label: Give up after
        what: A line still being made after this long is abandoned, and the next may go.
        unit: seconds
    waiting:
      title: Waiting
      what: How long each kind of reason to speak may wait for its turn.
      # Every kind of wait shares these.
      dropped: "{what} At 0, it’s never dropped."
      unit: seconds
      zero: Never dropped
      ttlSecondsPlayer:
        label: Your speech
        what: Characters answering you.
      ttlSecondsDirected:
        label: Said to someone
        what: Lines meant for a particular character.
      ttlSecondsUrgent:
        label: Urgent events
        what: Lines about something that just happened, such as an attack.
      ttlSecondsReaction:
        label: Reactions
        what: Characters reacting to what’s around them.
      ttlSecondsContinuation:
        label: Replies
        what: Characters answering one another.

  npcThoughts:
    title: NPC thoughts
    what: Unspoken thoughts a character has, coming only when a trigger or a mod asks for one.
    general:
      title: General
      enabled:
        label: NPC thoughts
        what: Let characters have thoughts at all. When off, requests for thoughts are ignored.
      perNPCCooldownSeconds:
        label: Between thoughts
        what: >-
          A minimum wait time between two thoughts for a single character, so
          one character doesn’t take every turn.
        unit: seconds
      eventHistoryCount:
        label: Recent events considered
        what: How many of the latest events a thought can draw on.
        unit: events
    inDialogue:
      title: In dialogue
      allowInlineInDialogue:
        label: Thoughts while speaking
        what: Let a character record a separate, unspoken thought while speaking.

  playerReactions:
    title: Player reactions
    what: >-
      Your character reacting to what happens without you doing anything: a
      thought, or a line said aloud, when certain events happen.
    general:
      title: General
      enabled:
        label: Player reactions
        what: >-
          Let your character react on their own. It’s the same switch as Player
          reactions among the quick toggles.
    events:
      title: Events
      eventConfigs:
        label: Reactions by event
        what: >-
          Each kind of event your character reacts to: whether they do, how, how
          likely they are to, and how long before they do again.
        noun: { one: "{count} event", other: "{count} events" }
        add: Add event
        cols:
          eventType:
            label: Event
          enabled:
            label: "On"
          responseType:
            label: As
            choices:
              thought:
                label: a thought
              audible:
                label: aloud
          probability:
            label: Chance
          cooldownSeconds:
            label: Cooldown
            unit: s

  bardSinging:
    title: Bard singing
    what: >-
      Bards singing songs: new ones a music service composes from what’s been
      happening and what bards remember, and ones already made.
    see: The songs of each playthrough are under {link}.
    seeLabel: Bard songs
    general:
      title: General
      bardSingingEnabled:
        label: Bard singing
        what: Let bards sing at all. It’s the same switch as Bards among the quick toggles.
      bardSingingGenerationComposeEnabled:
        label: Compose new songs
        what: >-
          Have the music service below compose new songs. Off, bards sing only
          the songs they already have.
      bardSingingPlaybackVolume:
        label: Volume
        what: >-
          How loud bards sing, next to the game’s other sounds. With Skyrim’s
          own audio engine in use, its SkyrimNet Bards slider sets this instead.
    composing:
      title: Composing
      bardSingingProvider:
        label: Music service
        what: Who composes new songs. Each costs credits there.
      bardSingingBackupProvider:
        label: Backup
        what: Who composes when the music service fails.
        choices:
          none:
            label: None
            what: no backup
      bardSingingGenerationIntervalHours:
        label: How often
        what: How many hours of game time pass between tries at a new song.
        unit: game hours
      bardSingingGenerationMaxCachedSongs:
        label: Songs kept
        what: >-
          How many composed songs each playthrough keeps. Past it, the oldest
          composed song’s audio is removed first; imported songs don’t count and
          are never removed.
        unit: songs
      bardSingingGenerationDefaultStyle:
        label: Style
        what: Words for the kind of music wanted, separated by commas.
        placeholder: medieval bardic folk, acoustic lute, harp, tavern ambiance
      bardSingingGenerationNegativeTags:
        label: Avoid
        what: Words for what the music shouldn’t be, separated by commas, such as modern genres.
        placeholder: electric guitar, synthesizer
      bardSingingGenerationLanguage:
        label: Sung in
        what: The language songs are sung in, as a two-letter code. Only AceStep uses it.
    # Each music service: a choice for who composes, and a section of its
    # own. Its key and model fields share the two below; {service} is the
    # service as they name it, and {where} where its key comes from.
    providerKey:
      label: Key
      what: Your {service} key, from {where}. It’s kept apart from the keys on the Providers page.
    providerModel:
      label: Model
      what: The music model, as {service} names it.
    providers:
      openrouter:
        label: OpenRouter
        what: openrouter.ai, with an OpenRouter key
        service: OpenRouter
        where: openrouter.ai
      suno:
        label: Suno
        what: sunoapi.org, with a key from there
        service: sunoapi.org
        where: sunoapi.org
        modelService: Suno
        bardSingingSunoBaseUrl:
          label: Address
          what: Where Suno’s service is reached. Change it only to go through a proxy of your own.
      nanoGpt:
        label: NanoGPT
        what: nano-gpt.com, with a NanoGPT key
        service: NanoGPT
        where: nano-gpt.com
      minimax:
        label: MiniMax
        what: api.minimax.io, with a MiniMax key
        service: MiniMax
        where: MiniMax
      acestepCloud:
        label: AceMusic
        what: acemusic.ai’s AceStep, with an AceMusic key
        service: AceMusic
        where: acemusic.ai
      acestepLocal:
        label: AceStep server
        what: an AceStep server you run
        service: your server
        bardSingingAcestepLocalBaseUrl:
          label: Address
          what: Your AceStep server’s full chat-completions address.

  actorFilter:
    title: Actor filter
    what: >-
      Which characters SkyrimNet involves at all: a few switches here, and lists
      of factions, races, and genders below. A whitelist entry also lets a
      character who can’t speak take part, the way Paarthurnax does.
    mode:
      title: Mode
      filterMode:
        label: Mode
        what: >-
          With a blacklist, every character takes part except those the
          blacklists name. With a whitelist, only those the whitelists name do.
        choices:
          blacklistExclusion:
            label: Blacklist
            what: Everyone but those listed
          whitelistOnly:
            label: Whitelist
            what: Only those listed
      allowOnlyActorsCapableOfSpeech:
        label: Only those who can speak
        what: Characters who can’t speak are left out, unless a whitelist names them.
      allowSummonedOrReanimated:
        label: Summoned and raised
        what: Summoned and reanimated characters always take part, whatever the lists say.

  memories:
    title: Memories
    what: >-
      How SkyrimNet turns what happens into memories, and which of them an NPC
      recalls when they speak.
    general:
      title: General
      performanceEnableBackgroundProcessing:
        label: Make memories in the background
        what: Turn events into memories while you play, rather than not at all.
      memoryRetrievalMaxMemoriesPerRetrieval:
        label: Memories recalled at once
        what: How many memories a single recall brings into a prompt.
      memoryLifecycleMaxMemoriesPerActor:
        label: Memory index starts at
        what: >-
          The starting capacity of each character’s search index. It grows past
          this, so it isn’t a limit.
      generationRulesMinImportanceForStorage:
        label: Keep memories above
        what: The importance a new memory needs to be kept at all.
    embeddingModel:
      title: Embedding model
      what: >-
        The model that turns memories into vectors for recall. Changing it
        re-embeds every memory in the background, and recall is partial until
        that finishes.
      embeddingModel:
        label: Model
        what: >-
          Bekko has the best recall, in English and other languages, and embeds
          about half as fast. all-MiniLM-L6-v2 is lighter and English only. A
          custom model goes in a folder of its own, holding its model.onnx and
          tokenizer.json, in SkyrimNet’s folder for custom models, and is chosen
          by its folder’s name.
        choices:
          bekkoEmbeddingV1A25m:
            label: Bekko Embedding v1
            what: Best recall, multilingual
          allMiniLML6V2:
            what: Lighter, English only
    performance:
      title: Performance
      performanceMaxConcurrentGenerations:
        label: Memories written at once
        what: How many memory generations run at the same time.
      performanceReembedThreads:
        label: Re-embedding threads
        what: >-
          CPU threads that re-index memories in the background after an update,
          at low priority. Lower it if the game stutters while that runs; it
          applies the next time re-embedding starts.
      performanceMemoryBatchSize:
        label: Memories per cycle
        what: How many memories one processing cycle generates.
    segments:
      title: Segment boundaries
      what: >-
        Events are cut into segments, and each segment becomes memories. These
        are in real minutes.
      boundaryConfigMaxTimeGapMinutesReal:
        label: Gap that ends a segment
        what: A pause between events longer than this starts a new segment.
      boundaryConfigMinSegmentDurationMinutesReal:
        label: Shortest segment
        what: A segment shorter than this isn’t turned into memories.
      boundaryConfigMaxSegmentDurationMinutesReal:
        label: Longest segment
        what: A segment this long is cut, whatever is happening.
      boundaryConfigMaxEventsPerSegment:
        label: Most events in a segment
        what: A segment with this many events is cut.
        unit: events
      boundaryConfigMinEventsPerSegment:
        label: Fewest events for a memory
        what: A segment with fewer events than this makes no memory.
        unit: events
    recall:
      title: Recall thresholds
      vectorStorageSimilarityThreshold:
        label: Similarity needed
        what: >-
          How alike a memory and the moment must be to count: 50% is related,
          100% a strong match.
      vectorStorageMinRelevanceScore:
        label: Relevance needed
        what: The overall score a memory needs to be recalled, once the weights below are applied.
    weights:
      title: Scoring weights
      what: How much each part of a memory’s fit counts toward its relevance.
      scoringWeightsSemantic:
        label: Meaning
        what: How alike the memory and the moment are in meaning.
      scoringWeightsTemporal:
        label: Recency
        what: How recent the memory is.
      scoringWeightsActor:
        label: Who was there
        what: Whether the people in the memory are the people here.
      scoringWeightsEmotional:
        label: Feeling
        what: How the memory’s mood fits the moment.
      scoringWeightsLocation:
        label: Place
        what: Whether the memory happened near here.
      scoringWeightsKeyword:
        label: Words
        what: Whether the memory shares words with what was said.
    worldKnowledge:
      title: World knowledge
      what: Lore and facts any NPC can draw on, from the History section’s Knowledge page.
      worldKnowledgeMaxSemanticResults:
        label: Entries recalled
        what: How many knowledge entries, found by relevance, go into an NPC’s prompt.
      worldKnowledgeMaxAlwaysInject:
        label: Always-included entries
        what: How many of the entries marked “always include” go in. 0 means all of them.
      worldKnowledgeSimilarityThreshold:
        label: Similarity needed
        what: How alike an entry and the moment must be to be considered, on the model’s scale.
      worldKnowledgeMinRelevanceScore:
        label: Relevance needed
        what: >-
          The combined score an entry needs to be included: the filter that
          keeps unrelated lore out, however high it ranks.
      worldKnowledgeWeightKeyword:
        label: Words
        what: How much shared words count in an entry’s score.
      worldKnowledgeWeightEmbedding:
        label: Meaning
        what: How much likeness in meaning counts.
      worldKnowledgeWeightImportance:
        label: Importance
        what: How much an entry’s own importance counts.
    vectorIndex:
      title: Vector index
      what: The search index’s build settings. The defaults suit almost everyone.
      vectorStorageHnswEfConstruction:
        label: Build effort
        what: "HNSW’s ef_construction: higher builds a better index, more slowly."
      vectorStorageHnswM:
        label: Connectivity
        what: "HNSW’s M: how many links each entry keeps. Higher uses more memory."

  memoryFilter:
    title: Memory filter
    what: >-
      Which characters form memories at all: a few switches here, and lists of
      factions, races, and genders below.
    mode:
      title: Mode
      enableMemoryFiltering:
        label: Filter memories
        what: Check each character against the switches and lists here before they form a memory.
      filterMode:
        label: Mode
        what: >-
          With a blacklist, everyone forms memories except those the blacklists
          name. With a whitelist, only those the whitelists name do.
        choices:
          blacklistExclusion:
            label: Blacklist
            what: Everyone but those listed
          whitelistOnly:
            label: Whitelist
            what: Only those listed
      allowOnlyActorsCapableOfSpeech:
        label: Only those who can speak
        what: Characters who can’t speak form no memories, unless a whitelist names them.
      allowPlayerMemories:
        label: Your character too
        what: Your own character forms memories.

  diaries:
    title: Diaries
    what: >-
      When SkyrimNet writes an entry in an NPC’s diary, what it draws on, and
      whether those entries come back as memories.
    general:
      title: General
      enabled:
        label: Write diaries
        what: Let NPCs keep diaries at all.
      respectDayBoundary:
        label: One day at a time
        what: Only events since midnight, game time, go into an entry.
      minEventsForGeneration:
        label: Events before an entry
        what: How many events not yet written up an NPC needs before an entry is written.
        unit: events
    content:
      title: Content
      maxRecentEvents:
        label: Recent events considered
        what: How many of the latest events an entry can draw on.
        unit: events
      maxRecentMemories:
        label: Memories considered
        what: How many memories an entry can draw on.
        unit: memories
      minImportanceScore:
        label: Memories above
        what: The importance a memory needs to be drawn on.
      targetEntryLength:
        label: Entry length
        what: The length an entry aims for, in words.
        unit: words
    recall:
      title: Recall
      excludeFromRecall:
        label: Keep diaries out of recall
        what: >-
          Skip the memories made from diary entries when an NPC recalls memories
          in conversation. The entries are still indexed, so searching them by
          hand still works.

  dynamicBios:
    title: Dynamic bios
    what: >-
      How SkyrimNet rewrites a character’s bio as you play: which sections it
      may change, and what it draws on.
    general:
      title: General
      enabled:
        label: Rewrite bios
        what: Let SkyrimNet update a character’s dynamic bio from what happens.
      preserveCorePersonality:
        label: Keep the core personality
        what: A rewrite keeps the character’s defining traits, whatever has happened.
    sections:
      title: Sections
      updatableBlocks:
        label: Sections it may rewrite
        what: Which sections of a bio a rewrite may change. The rest stay as written.
    context:
      title: Context
      maxRecentEvents:
        label: Recent events considered
        what: How many of the latest events a rewrite can draw on.
        unit: events
      maxMemories:
        label: Memories considered
        what: How many memories a rewrite can draw on.
        unit: memories
      minImportanceScore:
        label: Memories above
        what: The importance a memory needs to be drawn on.

  speech:
    title: Speech
    what: >-
      Which engine gives characters their voices, and what every engine shares:
      the narrator, characters without voice lines of their own, and subtitles.
      Each engine’s own settings are under Engines.
    engine:
      title: Engine
      ttsEngine:
        label: Engine
        what: What turns characters’ lines into speech. Without one, they aren’t spoken at all.
        # Each engine is a choice, by its name, with one of these two.
        local: runs on a machine of yours
        service: a service you sign up for
        choices:
          noop:
            label: None
            what: lines are only shown, never spoken
      ttsMaxSegmentWords:
        label: Words sent at once
        what: >-
          Lines go to the engine a sentence at a time. Above 0, short sentences
          in a row are joined, up to this many words, before they’re sent. At 0,
          every sentence goes on its own.
        unit: words
        zero: Each sentence
    narrator:
      title: Narrator
      ttsEnableNarratorAudioEffect:
        label: Narrator effect
        what: >-
          Play narration through an audio effect, so the narrator sounds apart
          from the characters.
      ttsEnablePlayerThoughtAudioEffect:
        label: Thoughts effect
        what: >-
          Play your character’s thoughts through an audio effect, so they sound
          apart from speech.
      ttsUseKokoroForNarrator:
        label: Kokoro narrator
        what: >-
          Narrate with Kokoro, a small voice model that runs on your own
          machine, rather than the engine.
      ttsKokoroNarratorVoice:
        label: Kokoro voice
        what: Which of Kokoro’s voices narrates.
      ttsKokoroVolumeLevel:
        label: Kokoro volume
        what: How loud Kokoro’s narration plays.
    gameDialogue:
      title: Game dialogue
      what: >-
        The game’s own dialogue: the lines you pick, and characters with no
        recording of a line.
      vanillaDialogueVoicePlayerChoices:
        label: Voice your choices
        what: >-
          Speak the line you pick in the dialogue menu in your character’s voice
          before the NPC answers.
      vanillaDialogueVoiceSilentNPCs:
        label: Voice silent characters
        what: >-
          Speak the game’s own lines for characters who have no recording of
          them. Universal Translator depends on it.
      vanillaDialogueFixSubtitleDuringTTS:
        label: Subtitle fix
        what: SkyrimNet’s fix for the game’s subtitle while such a line is spoken.
    subtitles:
      title: Subtitles
      subtitlesEnableNPCSubtitles:
        label: Characters’ lines
        what: Show what characters say as subtitles.
      subtitlesEnablePlayerSubtitles:
        label: Your lines
        what: Show what you say as subtitles.
      subtitlesEnableConsoleOutput:
        label: In the console
        what: Also write lines to the game’s console.
    volume:
      title: Volume
      audioUniversalMaxVolume:
        label: Loudest
        what: The most any of SkyrimNet’s audio plays at. 1 is full volume.

  # Each voice engine’s page: the Connection section every engine has, then
  # the engine’s own sections, then the four after it every engine shares.
  engines:
    connection:
      title: Connection
      endpoint:
        label: Address
        what: Where the server is reached.
        whatBundled: Left empty for the engine that comes with SkyrimNet.
        whatInworld: >-
          Where Inworld’s service is reached. It can name your account, so it’s
          kept like a key: Hermaeus never shows it.
      language:
        label: Language
        what: The language lines are spoken in, as the engine names it.
      timeout:
        label: Wait for a line
        what: How long to wait for the engine to speak a line before giving up.
        unit: seconds
      connectTimeout:
        label: Wait to connect
        what: How long to wait to reach the engine.
        unit: seconds
      maxParallelRequests:
        label: Lines at once
        what: >-
          How many lines the engine may work on at the same time. More starts
          speech sooner but takes more of the machine or account.
        unit: lines
      maxRetries:
        label: Retries
        what: >-
          How many times to ask again when the engine fails with a server error.
          At 0, a failed line isn’t retried.
        zero: None
      streamAudio:
        label: Stream
        what: >-
          Start playing a line while the rest of it is still being made, so
          speech begins sooner.
    tags:
      title: Tags
      what: Tags the model writes into a line, such as [sighs], for how it’s spoken.
      enableAudioTags:
        label: Use tags
        what: Pass tags on to the engine. Only engines that understand them do anything with them.
      allowedAudioTags:
        label: Allowed tags
        what: The tags passed on; others are taken out of the line.
        noun: { one: "{count} tag", other: "{count} tags" }
    pronunciation:
      title: Pronunciation
      pronunciationDictionary:
        label: Pronunciations
        what: Words the engine says wrong, each spelled the way it should sound.
        columns:
          first: Word
          second: Say it as
        noun: { one: "{count} word", other: "{count} words" }
        add: Add word
    narration:
      title: Narration
      narrativeEnabled:
        label: Speak narration
        what: Speak the narrator’s lines through this engine.
      narrativeUseNarratorVoice:
        label: Narrator’s voice
        what: Narrate in a narrator’s voice of its own.
      narrativeShowNarrativeInSubtitles:
        label: Narration subtitles
        what: Show narration as subtitles too.
    fallbackVoices:
      title: Fallback voices
      what: Voices used when a character’s own voice can’t be made.
      voiceFallbackEnabled:
        label: Fall back
        what: Speak in a fallback voice when a character’s own fails, rather than not at all.
      voiceFallbackDefaultFallbackVoiceMale:
        label: Men
        what: The voice type a man falls back to, when his race has none below.
      voiceFallbackDefaultFallbackVoiceFemale:
        label: Women
        what: The voice type a woman falls back to, when her race has none below.
      voiceFallbackRaceGenderFallbacks:
        label: By race
        what: The voice type each race and gender falls back to, before the two above.
        columns:
          first: Race and gender
          second: Voice type
        noun: { one: "{count} voice", other: "{count} voices" }

    pockettts:
      label: PocketTTS
      what: >-
        Voices made on your own machine, cloned from each voice type’s sample.
        It needs nothing else installed.
      voice:
        title: Voice
        maxLsdSteps:
          label: Steps
          what: How many passes go into each line. More sound better but take longer.
        temperature:
          label: Variety
          what: How much each line varies. Lower is steadier; higher is livelier.
        modelPrecision:
          label: Precision
          what: How the model runs.
          choices:
            fp32:
              what: better quality, best on a graphics card
            int8:
              what: faster on the processor, a little rougher
        deviceIndex:
          label: Device
          what: Which graphics card to use, counting from 0.
    piper:
      label: Piper
      what: >-
        Fast voices made on your own machine from voice model files, which are
        installed as a mod of their own.
      voice:
        title: Voice
        enablePreloading:
          label: Load at start
          what: Load the voice models when the game starts, rather than when each is first needed.
        piperSettingsNoiseScale:
          label: Expressiveness
          what: >-
            How much feeling voices carry. 1 is normal; higher is more dramatic,
            lower is flatter.
        piperSettingsNoiseW:
          label: Rhythm
          what: >-
            How natural the pacing sounds. 1 is normal; higher varies more,
            lower is more mechanical.
        piperSettingsLengthScale:
          label: Slowness
          what: How drawn out speech is. 1 is normal; higher is slower, lower is faster.
        piperSettingsNumThreads:
          label: Threads
          what: How many of the processor’s threads Piper uses.
        speakerId:
          label: Speaker
          what: >-
            Which speaker to use in a model with several, counting from 0. The
            usual English models have one.
    inworld:
      label: Inworld
      what: >-
        Inworld’s service, with voices cloned from each voice type’s sample. It
        needs an Inworld account and key.
      account:
        title: Account
        apiKeyBase64:
          label: Key
          what: Your Inworld key, as Inworld gives it, encoded in Base64.
        workspaceId:
          label: Workspace
          what: The Inworld workspace voices are cloned into.
      voice:
        title: Voice
        modelId:
          label: Model
          what: Which of Inworld’s models speaks.
          choices:
            inworldTts2:
              what: the best quality
            inworldTts2Flash:
              what: the fastest and cheapest
        temperature:
          label: Variety
          what: How much each line varies, from 0 to 2. Higher is more expressive.
        speakingRate:
          label: Speed
          what: How fast lines are spoken. 1 is normal.
        sampleRateHz:
          label: Sample rate
          what: The quality of the audio Inworld sends back.
          unit: Hz
        cloneCacheMaxVoices:
          label: Cloned voices kept
          what: >-
            How many voices may be cloned into the account. Past it, the voice
            used longest ago is deleted first; voices cloned outside SkyrimNet
            count, but are never deleted. At 0, there’s no limit.
          unit: voices
          zero: No limit
    elevenlabs:
      label: ElevenLabs
      what: >-
        ElevenLabs’s service, with voices cloned from each voice type’s sample.
        It needs an ElevenLabs key.
      account:
        title: Account
        apiKey:
          label: Key
          what: Your ElevenLabs key.
        cloneCacheSharedAccount:
          label: Shared account
          what: >-
            Switch on when more than one SkyrimNet install uses the account, so
            they reuse each other’s cloned voices rather than cloning over them.
        cloneCacheMaxVoices:
          label: Cloned voices kept
          what: >-
            How many voices may be cloned into the account. Past it, the voice
            used longest ago is deleted first. At 0, there’s no limit.
          unit: voices
          zero: No limit
      voice:
        title: Voice
        modelId:
          label: Model
          what: Which of ElevenLabs’s models speaks.
        voiceSettingsStability:
          label: Stability
          what: How consistent a voice is from line to line.
        voiceSettingsSimilarityBoost:
          label: Likeness
          what: How closely a voice keeps to the sample it was cloned from.
        voiceSettingsStyle:
          label: Style
          what: How much a voice exaggerates its delivery.
        voiceSettingsUseSpeakerBoost:
          label: Speaker boost
          what: Make voices clearer.
        useRequestContext:
          label: Earlier lines as context
          what: >-
            Send a speaker’s earlier lines with each request, for a steadier
            delivery. Only eleven_v4_turbo uses it, and lines are then made one
            at a time.
        outputFormat:
          label: Audio format
          what: The audio ElevenLabs sends back. Streaming needs a PCM format.
        optimizeStreamingLatency:
          label: Speed over quality
          what: "From 0 to 4: higher starts speech sooner, at some cost to quality."
    fateless:
      label: Fateless
      what: >-
        Fateless’s service, from SkyrimNet Beta 29: characters speak in their
        own in-game voices, with no server or key to set up. It needs a Fateless
        subscription, signed in from SkyrimNet’s dashboard.
      voice:
        title: Voice
        model:
          label: Model
          what: >-
            Which of Fateless’s speech models speaks. Directions such as [say
            bitterly in a low voice] need fateless/speech-plus; fateless/speech
            is faster and cheaper, and plays only sounds such as [sigh].
          choices:
            fatelessSpeechPlus:
              label: Speech Plus
              what: the default, with directions
            fatelessSpeech:
              label: Speech
              what: faster and cheaper, sounds only
        speed:
          label: Speed
          what: How fast lines are spoken. 1 is normal.
        temperature:
          label: Variety
          what: How much each line varies.
    xtts:
      label: XTTS
      what: >-
        Cloned voices from an XTTS server you run, on your own machine or rented
        through VastAI.
      voice:
        title: Voice
        enableLiveCloning:
          label: Clone as needed
          what: Clone a voice from its sample the first time it’s used, and keep it for next time.
    zonos:
      label: Zonos
      what: >-
        Voices that follow a character’s mood, from a Zonos server you run, on
        your own machine or rented through VastAI.
      voice:
        title: Voice
        model:
          label: Model
          what: Which Zonos model speaks.
          choices:
            zyphraZonosV01Hybrid:
              label: Hybrid
            zyphraZonosV01Transformer:
              label: Transformer
        speakingRate:
          label: Speed
          what: How fast lines are spoken. Lower is slower.
        pitchStd:
          label: Pitch variation
          what: How much the pitch moves. Higher is more varied.
        cfgScale:
          label: Guidance
          what: How closely speech follows the voice and mood it’s given.
        vqScore:
          label: VQ score
          what: Trades audio quality against speed.
        dnsmosOverall:
          label: Clarity target
          what: The audio quality aimed for, from 1 to 5.
        fmax:
          label: Highest frequency
          what: The highest frequency in the audio.
          unit: Hz
        denoiseSpeaker:
          label: Clean the sample
          what: Remove noise from a voice’s sample before cloning it.
        randomizeSeed:
          label: New seed each line
          what: Vary every line, rather than repeating the same delivery.
        unconditionalKeys:
          label: Unconditioned
          what: Conditions Zonos leaves for itself to decide, by name.
          noun: { one: "{count} condition", other: "{count} conditions" }
      sampling:
        title: Sampling
        topP:
          label: Top P
          what: A sampling setting. 0 leaves it off.
        minK:
          label: Min K
          what: A sampling setting. 0 leaves it off.
        minP:
          label: Min P
          what: A sampling setting. 0 leaves it off.
        linear:
          label: Linear
          what: A sampling setting.
        confidence:
          label: Confidence
          what: A sampling setting.
        quadratic:
          label: Quadratic
          what: A sampling setting.
    chatterbox:
      label: Chatterbox
      what: Expressive voices that take emotion tags, from a Chatterbox server you run.
      voice:
        title: Voice
        exaggeration:
          label: Expressiveness
          what: How dramatic emotions sound. Higher is more expressive.
        cfgWeight:
          label: Pace
          what: How the pace of speech is held.
        temperature:
          label: Variety
          what: How much each line varies.
        seed:
          label: Seed
          what: Repeat the same delivery for the same line. At -1, every line varies.
        voiceSampleRate:
          label: Sample rate
          what: The quality voice samples are sent at for cloning.
          unit: Hz
      sampling:
        title: Sampling
        minP:
          label: Min P
          what: A sampling setting.
        topP:
          label: Top P
          what: A sampling setting.
        repetitionPenalty:
          label: Repetition penalty
          what: Discourages the same sounds repeating.
    higgs:
      label: Higgs
      what: Voices from a Higgs Audio server you run, with tags for emotion, pace, and style.
      voice:
        title: Voice
        model:
          label: Model
          what: Which model the server uses.
        temperature:
          label: Variety
          what: How much each line varies.
        enableTagPropagation:
          label: Carry tags on
          what: >-
            A tag for emotion, style, or pace in one sentence of a reply carries
            on to the sentences after it.
    openaiCompatible:
      label: OpenAI-compatible
      what: >-
        Any speech service with an OpenAI-style API that clones voices, such as
        Boson.ai’s Higgs or a server you run yourself.
      account:
        title: Account
        serviceProfile:
          label: Service
          what: Your own server, or Boson.ai’s Higgs, whose address and model are fixed.
          choices:
            selfHosted:
              label: Your own server
        apiKey:
          label: Key
          what: >-
            Boson.ai’s key, or a token your own server asks for. Leave it empty
            if it asks for none.
      voice:
        title: Voice
        model:
          label: Model
          what: Which model the service uses.
        temperature:
          label: Variety
          what: How much each line varies.
        speed:
          label: Speed
          what: How fast lines are spoken. 1 is normal.
        topP:
          label: Top P
          what: A sampling setting.
        topK:
          label: Top K
          what: A sampling setting.
        transcribeMissingReferenceSamples:
          label: Transcribe samples
          what: >-
            When a voice’s sample has no transcript, make one with your speech
            recognition. Off, your own server gets an empty transcript.
        enableHiggsTags:
          label: Higgs tags
          what: >-
            Turn SkyrimNet’s tags into Higgs’s own. Switch off for a model whose
            tags are written differently.
        enableTagPropagation:
          label: Carry tags on
          what: >-
            A tag for emotion, style, or pace in one sentence of a reply carries
            on to the sentences after it.

  voiceSamples:
    title: Voice samples
    what: >-
      The recordings voices are cloned from: which of the game’s own lines may
      serve as a voice type’s sample, and the sample each voice type uses.
    whichLines:
      title: Which lines may be samples
      filteringMinDurationSeconds:
        label: Shortest
        what: Lines shorter than this aren’t used as samples.
      filteringMaxDurationSeconds:
        label: Longest
        what: Lines longer than this aren’t used as samples.
      filteringBannedKeywords:
        label: Left out by word
        what: >-
          Lines whose file name has one of these words aren’t used, such as
          screams, music, and coughs.
        noun: { one: "{count} word", other: "{count} words" }
      filteringBannedVoiceTypes:
        label: Voice types left out
        what: Voice types never cloned.
        noun: { one: "{count} voice type", other: "{count} voice types" }
      filteringExcludedPlugins:
        label: Plugins left out
        what: >-
          Game plugins whose lines are left out of the new audio scan and found
          the older way instead.
        noun: { one: "{count} plugin", other: "{count} plugins" }
    samples:
      title: Samples
      voiceTypes:
        label: Chosen samples
        what: >-
          The recording each voice type is cloned from: a voice file in the
          game’s data, or an audio file of your own.
        columns:
          first: Voice type
          second: Sample
        noun: { one: "{count} voice type", other: "{count} voice types" }

  speechToText:
    title: Speech to text
    what: >-
      How what you say into your microphone becomes text for characters to
      answer: which recognizer listens, and when it decides you’ve finished
      speaking.
    recognizer:
      title: Recognizer
      backend:
        label: Recognizer
        what: What turns your speech into text.
        choices:
          whisper:
            label: Whisper
            what: runs on your machine
          parakeet:
            label: Parakeet
            what: runs on your machine, and tells languages apart itself
          externalWhisper:
            label: Whisper service
            what: any OpenAI-style transcription API; a hosted one needs a key
          fateless:
            label: Fateless
            what: fateless.ai, with an account there
          none:
            label: None
            what: no microphone; you can still type
      language:
        label: Language
        what: The language you speak, as a two-letter code. Whisper also takes auto-detect.
      nameHints:
        label: Name hints
        what: >-
          Tell the recognizer the names of you, nearby and pinned characters,
          and nearby places, so they come back spelled right. The stt_hints
          prompt sets what’s sent. Whisper on your machine has its own switch,
          under Whisper.
      enablePartialResults:
        label: Text as you speak
        what: Show what’s been recognized so far while you’re still speaking.
    whisper:
      title: Whisper
      what: When the recognizer is Whisper.
      whisperNameHints:
        label: Name hints
        what: >-
          Send Whisper the names, as above. Off unless set: with the names sent,
          Whisper can sometimes turn a whole message into a stray word.
      whisperModel:
        label: Model
        what: >-
          Larger models are more accurate, and slower. A model is downloaded the
          first time it’s used.
      whisperUseWhisperFinetune:
        label: Skyrim’s version
        what: Use a version of the model trained for the game’s words, where there is one.
      whisperUseGpu:
        label: Graphics card
        what: Run on the graphics card rather than the processor.
      whisperGpuDeviceIndex:
        label: Card
        what: Which graphics card, counting from 0.
      whisperThreads:
        label: Threads
        what: How many of the processor’s threads it uses.
      whisperInputSampleRate:
        label: Sample rate
        what: The sample rate of the microphone’s audio as it reaches Whisper.
        unit: Hz
    parakeet:
      title: Parakeet
      what: When the recognizer is Parakeet.
      parakeetModel:
        label: Model
        what: Smaller versions are faster; larger ones are more accurate.
        choices:
          q80:
            what: recommended
          f16:
            what: the largest
      parakeetUseGpu:
        label: Graphics card
        what: Run on the graphics card rather than the processor.
      parakeetGpuDeviceIndex:
        label: Card
        what: Which graphics card, counting from 0.
      parakeetThreads:
        label: Threads
        what: How many of the processor’s threads it uses.
    fateless:
      title: Fateless
      what: When the recognizer is Fateless, through SkyrimNet’s Fateless sign-in.
      fatelessModel:
        label: Model
        what: Which of Fateless’s transcription models listens.
      fatelessStreaming:
        label: Stream while talking
        what: >-
          With push-to-talk, send your voice while you hold the key, once it
          hears you speak, so the text is ready moments after you let go. It
          costs a little more per minute.
    whisperService:
      title: Whisper service
      what: When the recognizer is a Whisper service.
      externalWhisperApiEndpoint:
        label: Address
        what: The service’s transcription address.
      externalWhisperApiKey:
        label: Key
        what: The service’s key. A server of your own may not need one.
      externalWhisperModel:
        label: Model
        what: >-
          The model as the service names it, such as openai/whisper-1 on
          OpenRouter or whisper-1 on OpenAI.
      externalWhisperTimeoutMs:
        label: Wait for text
        what: How long to wait for the service before giving up.
        unit: ms
    openMic:
      title: Open mic
      what: Listening without a key held down.
      streamingSilenceThreshold:
        label: Speech threshold
        what: >-
          How sure the voice detector must be that a sound is speech, in your
          microphone and in characters’ voice files.
      streamingSilenceDuration:
        label: Pause that ends it
        what: How long you must be quiet before what you said is sent.
        unit: ms
      streamingChunks:
        label: Chunks held
        what: How many pieces of audio are held at once for recognizing.
      streamingOpenMicVerbose:
        label: Notices
        what: Show a notice when open mic hears you and when it sends what you said.

  hotkeys:
    title: Hotkeys
    what: >-
      The keys that drive SkyrimNet while you play. Press a key to set one, or
      click with a mouse button; any key can be left unset.
    input:
      title: Input
      textInput:
        label: Type to speak
        what: Say something to the characters around you, typed.
      recordSpeech:
        label: Push to talk
        what: Hold to record what you say, release to send it.
      toggleOpenMic:
        label: Open mic
        what: Switch the microphone to always listening, instead of push to talk.
      voiceThought:
        label: Think aloud
        what: Hold to voice a thought to yourself. A quick tap prompts a thought with nothing said.
      voiceDialogueTransform:
        label: Speak in character
        what: >-
          Hold to say something that’s rewritten as your character would say it.
          A quick tap prompts a line with nothing said.
      voiceDirectInput:
        label: Tell the GameMaster
        what: >-
          Hold to state something as fact, such as “lightning suddenly strikes”,
          and characters react as though it happened.
      dialogueChoice:
        label: Choose a dialogue option
        what: >-
          With the game’s dialogue menu open: a quick tap has the model pick an
          option for you to confirm; hold and speak to say what you mean, and it
          picks the closest option.
    dashboard:
      title: Dashboard and menus
      wheelMenu:
        label: Wheel menu
        what: Open the wheel of every SkyrimNet action.
      openLabelPanel:
        label: Labeling panel
        what: >-
          Pause the game and open the labeling panel over the last recorded
          outputs. It needs request recording on, in SkyrimNet’s developer
          settings.
      toggleDashboard:
        label: Dashboard
        what: Open or close SkyrimNet’s dashboard in game.
    switches:
      title: Switches
      toggleGlobalAI:
        label: SkyrimNet on or off
        what: Switch all of SkyrimNet’s AI on or off.
      toggleGameMaster:
        label: GameMaster on or off
        what: Switch the GameMaster, which prompts characters to speak now and then.
      toggleContinuousMode:
        label: Continuous scene
        what: >-
          Keep a conversation going: as one character finishes, the GameMaster
          has another speak.
      toggleWhisperMode:
        label: Whisper
        what: Switch between whisper and normal speaking distance.
      toggleWorldEventReactions:
        label: Reactions on or off
        what: >-
          Switch characters reacting to what happens around them, including each
          other’s lines.
    actions:
      title: Actions
      continueNarration:
        label: Continue
        what: >-
          Have a character speak up, to react to something or pick a stalled
          conversation back up.
      captureCrosshair:
        label: Capture
        what: >-
          Opens the capture window, for the character or furniture in your
          crosshairs, yourself, or where you are. With Ctrl, it captures
          straight away: a quick press for what’s in your crosshairs, or hold
          for a second for yourself. With a book open, it captures the book.
      generateDiaryBio:
        label: Diary and bio now
        what: >-
          Write diary entries and update bios now, for you, those nearby, those
          pinned, or whoever is in your crosshairs.
      interruptDialogue:
        label: Interrupt
        what: Stop every character speaking, and clear what’s waiting to be said.

# Content records: actions, triggers, voice effects, and the other record
# files SkyrimNet reads, with the pages that list, compare, and edit them.
records:
  # What the record pages share.
  yourEdits: Your edits
  defaults: SkyrimNet’s defaults
  unknownLayer: an unknown layer
  kind: Kind
  from: From
  yoursCount: "{count} yours"
  offCount: "{count} off"
  cantBeRead: can’t be read
  isOff: "Off: SkyrimNet doesn’t use it."
  unreadable: "SkyrimNet can’t read this file: {error}"
  noMatch: Nothing matches “{query}”.
  notText: Not text, so it can’t be shown.
  replacesFlag: replaces {source}’s
  limitsTitle: Limits Hermaeus can’t check

  # Where a record comes from, and what it replaces: “From X, in place of
  # Y, then Z.”
  fromDefaults: From SkyrimNet’s defaults
  fromPlugin: From {plugin}
  origin: "{source}."
  originInPlaceOf: "{source}, in place of {layers}."
  thenJoin: ", then "
  listJoin: ", "

  # The player’s own copy.
  editCopy: Edit as your copy
  removeCopy: Remove your copy
  yourOwnCopy: your own copy
  editingCopy: Editing {yourCopy}, which SkyrimNet uses in every playthrough.
  editingCopyInPlaceOf: Editing {yourCopy}, which SkyrimNet uses in every playthrough in place of the one from {layer}.
  startingFrom: Starting from the copy from {layer}. Saving makes your own copy, which replaces it in every playthrough.
  savedCopy: Saved your copy. SkyrimNet reads it from the next time it starts.
  removeCopyConfirm: Remove your copy of {name}? A backup is kept, and {next}.
  removedCopyBelow: Removed your copy. The one below applies again.

  # What a switch in content-registry.json did.
  switchedOn: >-
    Switched on in content-registry.json, as SkyrimNet’s dashboard does; its
    file is unchanged. SkyrimNet uses it from the next time it starts.
  switchedOff: >-
    Switched off in content-registry.json, as SkyrimNet’s dashboard does; its
    file is unchanged. SkyrimNet ignores it from the next time it starts.
  followingFile: >-
    Its switch is gone from content-registry.json, so its file decides again,
    from the next time SkyrimNet starts.

  # A record switched against what its file says.
  overridden:
    switchedOn: >-
      Switched on in content-registry.json, where SkyrimNet’s dashboard keeps
      its switches. Its file says off.
    switchedOff: >-
      Switched off in content-registry.json, where SkyrimNet’s dashboard keeps
      its switches. Its file says on.
    follow: Follow its file

  # The list of actions or triggers, grouped by where each comes from.
  list:
    fromPlugin: "{records} from {plugin}"
    fromSources:
      one: "{records} from {count} source"
      other: "{records} from {count} sources"
    replacesOne: Replaces the one from {source}.
    itsFile: Its file, on the Content page

  actions:
    title: Actions
    noun: action
    column: Action
    count: { one: "{count} action", other: "{count} actions" }
    search: Search actions
    none: No actions in your plugins or your own edits.
    lead: >-
      What NPCs can do, beyond speaking: the model reads each action’s
      description and picks one when it fits. Each comes from a plugin or your
      own edits.
    category: Category
    priority: Priority
    whoMay: Who may
    rules: { one: "{count} eligibility rule", other: "{count} eligibility rules" }
    anyone: Anyone, at any time
    runs: Runs
    quest: Quest
    eventText: Event text
    confirm: Confirm
    asksFirst: Asks you first
    fillsIn: The model fills in
    optional: "{kind}, optional"
    note: >-
      SkyrimNet also has a few actions built in, such as continuing a
      conversation, which aren’t files and aren’t listed. Actions are edited
      and made on the Content page.

  triggers:
    title: Triggers
    noun: trigger
    column: Trigger
    count: { one: "{count} trigger", other: "{count} triggers" }
    search: Search triggers
    none: No triggers in your plugins or your own edits.
    lead: >-
      How SkyrimNet responds when something happens in the game: a kind of
      event, the conditions it must meet, and what follows, such as narration
      or a diary entry.
    when: When
    then: Then
    cooldown: Cooldown
    minutes: "{value} min"
    seconds: "{value} s"
    and: And
    chance: Chance
    forScope: "{response}, for {scope}"
    effect: Effect
    whicheverTarget: Whichever the target has
    whoHears: Who hears
    priority: Priority
    interrupts: Interrupts
    whoeverSpeaking: Whoever is speaking
    whatItSays: What it says
    note: Triggers are edited and made on the Content page.

  # Every record file, by kind, and its YAML.
  content:
    title: Content
    count: { one: "{count} record", other: "{count} records" }
    newRecord: New record
    allKinds: All kinds
    search: Search records
    lead: >-
      The record files SkyrimNet reads, from your plugins and your own edits.
      Where two layers have the same file, the higher one’s copy is used:
      yours, then the plugins in the Plugins page’s order, then SkyrimNet’s
      defaults.
    readOnly: Skyrim is running, so records can only be read.
    none: No records in SkyrimNet’s defaults, your plugins, or your own edits.
    record: Record
    ownCopy: Your own copy
    windowsEndings: Windows line endings
    savedAsCopy: Saved as your own copy. SkyrimNet reads it in place of the one below from the next time it starts.
    removedCopy: Removed your copy.
    nextBelow: the copy from {source} applies again
    nextNone: nothing replaces it, since only you have it
    useForm: Use the form
    limits: >-
      SkyrimNet limits what each stage’s settings and a voice sample can be, in
      ways that aren’t published, so Hermaeus can’t check them here. An effect
      outside those limits may not work in the game.
    asYaml: "{name} as YAML"
    # Each kind of record, by its folder.
    kinds:
      triggers: Triggers
      actions: Actions
      filters: Filters
      voiceEffects: Voice effects
      entities: Entities
      dialogueActions: Dialogue actions
      translator: Speech rules
      items: Items
      spells: Spells
      furniture: Furniture names
      identity: Identity links
      places: Named places

  # A record’s form, for an existing record or a new one.
  editor:
    badFileName: A file name is up to 64 letters, digits, hyphens, and underscores, starting with a letter or digit.
    made: Made {path}. SkyrimNet reads it from the next time it starts.
    savedAsCopy: Saved as your own copy, in place of the one below. SkyrimNet reads it from the next time it starts.
    makeIt: Make it
    newKind: New {noun}
    record: record
    madeInEdits: It’s made in your edits, and SkyrimNet reads it in every playthrough.
    editYaml: Edit as YAML
    fileName: File name
    savedAs: Saved as {path}.
    savedAsSame: Saved as {path}, and its {key} is the same.
    unreadable: "This file can’t be read as a record: {error}."
    notCovered: This one is laid out in a way the form doesn’t cover.
    editItYaml: Edit it as YAML

  # A form’s blocks of fields, and its lists of items. {item} is a list’s
