<!doctype html>
<html lang="en" data-theme="__HERMAEUS_THEME__">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- Hermaeus replaces this with the session's token when it serves the page. -->
		<meta name="hermaeus-token" content="__HERMAEUS_TOKEN__" />
		<title>Hermaeus</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
