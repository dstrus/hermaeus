# TypeScript types for the API, generated from the Go types the server sends
# and receives. Run `make types` after changing any of these files; the
# output in web/src/lib/api/types/ is generated, so don't edit it by hand.
#
# A type from another package needs a type_mappings entry and an import in
# frontmatter. Without one it comes out as `unknown`, which TypeScript then
# refuses to use, rather than `any`, which it would let through unchecked.
packages:
  - path: hermaeus/internal/store
    include_files: [playthroughs.go]
    output_path: web/src/lib/api/types/store.ts
    fallback_type: unknown
  - path: hermaeus/internal/httpapi
    include_files: [httpapi.go]
    output_path: web/src/lib/api/types/httpapi.ts
    fallback_type: unknown
  - path: hermaeus/internal/server
    include_files: [api.go]
    output_path: web/src/lib/api/types/api.ts
    fallback_type: unknown
    frontmatter: |
      import type * as store from './store.ts';
    type_mappings:
      store.Playthrough: store.Playthrough
  - path: hermaeus/internal/characters
    include_files: [pins.go, list.go, overview.go, stats.go]
    output_path: web/src/lib/api/types/characters.ts
    fallback_type: unknown
    enum_style: union
    frontmatter: |
      import type * as calendar from './calendar.ts';
    type_mappings:
      calendar.GameDate: calendar.GameDate
  - path: hermaeus/internal/calendar
    include_files: [gamedate.go]
    output_path: web/src/lib/api/types/calendar.ts
    fallback_type: unknown
  - path: hermaeus/internal/memories
    include_files: [memories.go, diary.go, edit.go, diary_edit.go]
    output_path: web/src/lib/api/types/memories.ts
    fallback_type: unknown
    frontmatter: |
      import type * as calendar from './calendar.ts';
    type_mappings:
      calendar.GameDate: calendar.GameDate
  - path: hermaeus/internal/bios
    include_files: [bios.go, save.go, history.go]
    output_path: web/src/lib/api/types/bios.ts
    fallback_type: unknown
  - path: hermaeus/internal/settings
    include_files: [settings.go, save.go, toggles.go, pins.go]
    output_path: web/src/lib/api/types/settings.ts
    fallback_type: unknown
  - path: hermaeus/internal/layers
    include_files: [layers.go]
    output_path: web/src/lib/api/types/layers.ts
    fallback_type: unknown
  - path: hermaeus/internal/prompts
    include_files: [prompts.go, save.go, pins.go]
    output_path: web/src/lib/api/types/prompts.ts
    fallback_type: unknown
    frontmatter: |
      import type * as layers from './layers.ts';
    type_mappings:
      layers.Layer: layers.Layer
